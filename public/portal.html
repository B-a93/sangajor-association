<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#123c31" />
  <title>MySANGAJOR Secure Portal</title>
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#16231f;background:#f7f5ef;--green:#123c31;--green2:#1d5949;--gold:#c6a35d;--cream:#f7f5ef;--muted:#69766f;--line:rgba(18,60,49,.14)}*{box-sizing:border-box}body{margin:0;min-width:320px}button,input,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at top right,rgba(198,163,93,.2),transparent 35%),var(--cream)}.card{width:min(100%,520px);background:#fff;border:1px solid var(--line);border-radius:28px;padding:32px;box-shadow:0 28px 80px rgba(18,60,49,.15)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:30px}.mark{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:var(--gold);font:700 25px Georgia}.brand strong,.brand small{display:block}.brand strong{letter-spacing:.14em;color:var(--green)}.brand small{color:var(--muted);margin-top:3px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--green2)}h1{font:700 38px/1.08 Georgia;margin:14px 0 10px}p{color:var(--muted);line-height:1.65}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;background:#edf1ec;border-radius:14px;margin:24px 0}.tabs button{border:0;border-radius:10px;padding:12px;background:transparent;font-weight:700;color:var(--muted)}.tabs button.active{background:#fff;color:var(--green);box-shadow:0 5px 14px rgba(18,60,49,.09)}label{display:grid;gap:8px;font-size:13px;font-weight:700;margin-top:16px}input,select{width:100%;border:1px solid var(--line);border-radius:13px;padding:14px;background:#fff;color:#16231f}.primary{width:100%;border:0;border-radius:999px;padding:15px;margin-top:22px;background:var(--green);color:#fff;font-weight:800}.secondary{border:0;background:transparent;color:var(--green);font-weight:700;margin:18px auto 0;display:block}.security{display:flex;gap:11px;align-items:flex-start;padding:15px;margin-top:22px;border-radius:14px;background:#edf1ec;color:var(--green);font-size:13px}.security strong,.security small{display:block}.security small{color:var(--muted);margin-top:3px}.demo{font-size:12px;text-align:center;margin:18px 0 0}.dashboard{min-height:100vh;background:#f4f6f3}.topbar{display:flex;justify-content:space-between;align-items:center;padding:20px clamp(20px,5vw,70px);background:#fff;border-bottom:1px solid var(--line)}.user{display:flex;gap:10px;align-items:center}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-weight:800}.logout{border:1px solid var(--line);border-radius:999px;background:#fff;padding:10px 15px;color:var(--green);font-weight:700}.content{padding:42px clamp(20px,6vw,80px)}.welcome{padding:28px;border-radius:24px;background:linear-gradient(135deg,var(--green),#0b2922);color:#fff}.welcome p{color:rgba(255,255,255,.72)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:20px}.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.metric strong,.metric span{display:block}.metric strong{font-size:24px;color:var(--green);margin-bottom:6px}.metric span{font-size:12px;color:var(--muted)}.panel{margin-top:20px}.access{display:grid;gap:10px;margin-top:16px}.access span{padding:12px;border-radius:11px;background:#edf1ec;color:var(--green);font-size:13px}.restricted{background:#fff0ef!important;color:#a4312b!important}@media(max-width:720px){.card{padding:24px}.grid{grid-template-columns:1fr 1fr}.topbar{align-items:flex-start;gap:16px}.user{flex-wrap:wrap;justify-content:flex-end}}@media(max-width:460px){.grid{grid-template-columns:1fr}h1{font-size:32px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const state={mode:'member',step:'identify',identifier:'',role:'ipro',session:null};
    const app=document.getElementById('app');
    function render(){
      if(state.session){const confidential=['chairman','secretary-general'].includes(state.session.role);const analytics=['ipro','chairman'].includes(state.session.role);app.innerHTML=`<div class="dashboard"><header class="topbar"><div class="brand" style="margin:0"><span class="mark">S</span><span><strong>SANGAJOR</strong><small>Digital Village</small></span></div><div class="user"><div class="avatar">${state.session.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</div><div><strong>${state.session.name}</strong><small style="display:block;color:var(--muted)">${label(state.session.role)}</small></div><button class="logout" id="logout">Sign out</button></div></header><main class="content"><section class="welcome"><span class="eyebrow" style="color:#d8c79b">Welcome home</span><h1>Good evening, ${state.session.name.split(' ')[0]}.</h1><p>Here is what is happening in your community today.</p></section><section class="grid"><article class="metric"><strong>18 days</strong><span>Until Annual Reunion</span></article><article class="metric"><strong>2 new</strong><span>Announcements</span></article><article class="metric"><strong>Under review</strong><span>Member Care request</span></article><article class="metric"><strong>286</strong><span>Active members</span></article></section><section class="panel"><span class="eyebrow">Your access</span><h2>${label(state.session.role)}</h2><div class="access"><span>Secure authenticated session</span><span>Role-based permissions active</span><span class="${confidential?'':'restricted'}">Confidential Member Care: ${confidential?'Allowed':'Restricted'}</span>${analytics?'<span>Communications and platform analytics: Allowed</span>':''}</div></section></main></div>`;document.getElementById('logout').onclick=()=>{state.session=null;state.step='identify';render()};return;}
      app.innerHTML=`<main class="shell"><section class="card"><div class="brand"><span class="mark">S</span><span><strong>SANGAJOR</strong><small>Secure Access</small></span></div><span class="eyebrow">${state.mode==='member'?'Member access':'Executive access'}</span><h1>${state.step==='otp'?'Enter verification code':state.mode==='member'?'Welcome to MySANGAJOR':'Executive Office sign in'}</h1><p>${state.step==='identify'?'Enter your registered email address or phone number.':state.step==='password'?'Enter your executive account password.':'We sent a six-digit code to your registered contact.'}</p>${state.step==='identify'?`<div class="tabs"><button id="memberTab" class="${state.mode==='member'?'active':''}">Member</button><button id="executiveTab" class="${state.mode==='executive'?'active':''}">Executive</button></div>`:''}<form id="form">${state.step==='identify'?'<label>Email or phone number<input id="identifier" required placeholder="name@example.com or +220..."></label>':''}${state.step==='password'?'<label>Password<input type="password" required placeholder="Enter your password"></label><label>Demo executive role<select id="role"><option value="ipro">IPRO</option><option value="chairman">Chairman</option><option value="secretary-general">Secretary General</option></select></label>':''}${state.step==='otp'?'<label>Six-digit code<input id="otp" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000"></label>':''}<button class="primary" type="submit">${state.step==='identify'?'Continue':state.step==='password'?'Verify password':'Sign in securely'}</button></form>${state.step!=='identify'?'<button class="secondary" id="back">Go back</button>':''}<div class="security"><span>🔐</span><span><strong>Protected access</strong><small>Members use passwordless OTP. Executives use password plus OTP.</small></span></div><p class="demo">Prototype mode: use any valid-looking details and any six-digit code.</p></section></main>`;
      if(state.step==='identify'){document.getElementById('memberTab').onclick=()=>{state.mode='member';render()};document.getElementById('executiveTab').onclick=()=>{state.mode='executive';render()}}
      document.getElementById('form').onsubmit=e=>{e.preventDefault();if(state.step==='identify'){state.identifier=document.getElementById('identifier').value;state.step=state.mode==='executive'?'password':'otp'}else if(state.step==='password'){state.role=document.getElementById('role').value;state.step='otp'}else{const role=state.mode==='member'?'member':state.role;state.session={role,name:role==='member'?'Omar Bah':role==='ipro'?'Banna Bojang':role==='chairman'?'Omar Bah':'Secretary General'}}render()};
      const back=document.getElementById('back');if(back)back.onclick=()=>{state.step=state.step==='otp'&&state.mode==='executive'?'password':'identify';render()};
    }
    function label(role){return({member:'Member',ipro:'Information & Public Relations Officer',chairman:'Chairman','secretary-general':'Secretary General'})[role]}
    render();
  </script>
</body>
</html>
